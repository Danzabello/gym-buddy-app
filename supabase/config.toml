
[functions.coach-max-cron]
enabled = true
verify_jwt = true
import_map = "./functions/coach-max-cron/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/coach-max-cron/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/coach-max-cron/*.html" ]

[functions.delete-account]
enabled = true
# Caller must be authenticated: the function deletes the JWT owner's own
# account (auth.users + user_profiles) via the Admin API. verify_jwt gates it.
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

[functions.invite-redirect]
enabled = true
# Public endpoint: hit directly from browsers/Snapchat/email with no JWT.
# It authenticates nothing from the caller — it looks the invite up with the
# service-role key and 302-redirects. verify_jwt MUST stay false or the
# platform gateway 401s every real link click (LIVE-13 / audit Group G).
verify_jwt = false
import_map = "./functions/invite-redirect/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/invite-redirect/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/invite-redirect/*.html" ]
