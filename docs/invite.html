<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Buddy Invite</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0B1F1A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="assets/site.css?v=1">
</head>
<body class="invite">
  <div class="card">
    <div id="loading">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2 4L12 12l-3 1.5a5 5 0 0 0-2 4V21M17 3v3.5a5 5 0 0 1-2 4L12 12l3 1.5a5 5 0 0 1 2 4V21"/></svg></span>
      <p>Loading your invite...</p>
    </div>
    <div id="content" style="display:none"></div>
  </div>

  <script>
    const APP_ID = 'com.gymbuddy.app';
    const INVITE_LINK = 'jwpbunulswiihkzpjopy.supabase.co/functions/v1/invite-redirect';

    const params = new URLSearchParams(window.location.search);
    // The query string is attacker controlled. A code that is not exactly 8
    // letters and digits gets the Not Found card, so nothing else ever
    // reaches the intent URL below.
    const code = (params.get('code') || '').toUpperCase();
    const validCode = /^[A-Z0-9]{8}$/.test(code);
    const inviter = params.get('inviter');
    const error = params.get('error');

    const content = document.getElementById('content');
    const loading = document.getElementById('loading');

    if (error || !validCode) {
      content.innerHTML = `
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg></span>
        <h1>Invite <span>Not Found</span></h1>
        <p class="error">This invite link is invalid, expired, or has already been used.</p>
        <p>Ask your buddy to send you a fresh invite link.</p>
      `;
    } else {
      // Static markup only. The name and code go in with textContent below.
      content.innerHTML = `
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4 6.5 6.5 6.5 11a6.5 6.5 0 0 1-13 0c0-4.5 3-7 6.5-11z"/><path d="M12 21a3 3 0 0 0 3-3c0-2-1.5-3-3-4.5C10.5 15 9 16 9 18a3 3 0 0 0 3 3z"/></svg></span>
        <h1><span id="inviter"></span> wants to be your Gym Buddy!</h1>
        <p>Stay accountable together. You both check in daily &mdash; miss a day and the streak dies. No solo streaks. That's the point.</p>
        <div class="code-row">
          <div class="code-pill">INVITE: <span id="code"></span></div>
          <button type="button" class="copy-btn" id="copy">Copy code</button>
        </div>
        <div id="android">
          <a class="btn" id="open">Open Gym Buddy</a>
          <p class="note">Don't have it yet? This takes you to the Play Store, and your invite comes with you.</p>
        </div>
        <p class="note" id="desktop" style="display:none">Gym Buddy is an Android app. Open this link on your phone.</p>
        <p style="font-size:13px; margin-bottom:0;">If your invite doesn't show up in the app, choose "Have an invite code?" on the buddy step and type the code above.</p>
      `;

      // Cut by code points, so an emoji is never split in half.
      document.getElementById('inviter').textContent =
        Array.from(inviter || 'Someone').slice(0, 30).join('');
      const codeEl = document.getElementById('code');
      codeEl.textContent = code;

      // Installed: Chrome hands the invite link to the app, whose intent
      // filter matches it. Not installed: Chrome opens the fallback, the Play
      // Store, with the code as the install referrer the app reads on first
      // launch. The fallback is a URL inside a URL, so it is encoded again.
      const playUrl = 'https://play.google.com/store/apps/details?id=' + APP_ID +
        '&referrer=' + encodeURIComponent('invite_code=' + code);
      document.getElementById('open').href =
        'intent://' + INVITE_LINK + '?code=' + code +
        '#Intent;scheme=https;package=' + APP_ID +
        ';S.browser_fallback_url=' + encodeURIComponent(playUrl) + ';end';

      if (!/Android/i.test(navigator.userAgent)) {
        document.getElementById('android').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
      }

      const copyBtn = document.getElementById('copy');
      let resetTimer;
      function copied() {
        copyBtn.textContent = 'Copied';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { copyBtn.textContent = 'Copy code'; }, 2000);
      }
      // Without the clipboard API (old browser, or a page that is not a
      // secure context) the code is selected, so a long-press copies it.
      function selectCode() {
        const range = document.createRange();
        range.selectNodeContents(codeEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        try { if (document.execCommand('copy')) copied(); } catch (e) {}
      }
      copyBtn.addEventListener('click', () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(copied, selectCode);
        } else {
          selectCode();
        }
      });
    }

    loading.style.display = 'none';
    content.style.display = 'block';
  </script>
</body>
</html>
